<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo — MangaReader</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body style="align-items: center; justify-content: center; background-color: var(--bg-main);">

  <div style="width: 100%; max-width: 400px; padding: 2.25rem; background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div class="brand-logo" style="margin: 0 auto 0.75rem; width: 42px; height: 42px; font-size: 1.25rem; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); background-color: var(--primary); color: #FFFFFF;">🔐</div>
      <h1 style="font-size: 1.4rem; font-weight: 800;">Painel de Controle</h1>
      <p style="color: var(--text-muted); font-size: 0.825rem; margin-top: 0.2rem;">Entre com suas credenciais de administrador</p>
    </div>

    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label" for="username-input">Usuário</label>
        <input type="text" id="username-input" class="form-control" required placeholder="admin" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password-input">Senha</label>
        <input type="password" id="password-input" class="form-control" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%;">
          <span>Entrar no Painel</span>
        </button>
      </div>

      <div style="margin-top: 1.25rem; text-align: center; font-size: 0.8rem; color: var(--text-subtle);">
        Padrão: <code>admin</code> / <code>admin123</code>
      </div>
    </form>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin-auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAdminAuth(true);

      const form = document.getElementById('admin-login-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username-input').value.trim();
        const password = document.getElementById('password-input').value;
        const btn = document.getElementById('login-submit-btn');

        btn.disabled = true;
        btn.textContent = 'Autenticando...';

        try {
          const res = await api.post('/admin/login', { username, password });
          if (res.success) {
            showToast('Login realizado com sucesso!', 'success');
            setTimeout(() => {
              window.location.href = '/admin';
            }, 400);
          } else {
            showToast(res.error || 'Credenciais inválidas', 'error');
            btn.disabled = false;
            btn.textContent = 'Entrar no Painel';
          }
        } catch (err) {
          showToast(err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Entrar no Painel';
        }
      });
    });
  </script>
</body>
</html>
